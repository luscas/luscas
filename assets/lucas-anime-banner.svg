<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="title desc">
  <title id="title">Lucas Paz — CTO and Software Architect</title>
  <desc id="desc">Original anime-cyberpunk city illustration with neon violet and cyan lights, a futuristic anime engineer, and Lucas Paz's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1b"/><stop offset=".52" stop-color="#10142b"/><stop offset="1" stop-color="#120a27"/>
    </linearGradient>
    <radialGradient id="skyglow"><stop offset="0" stop-color="#7f39d5" stop-opacity=".49"/><stop offset=".62" stop-color="#562a94" stop-opacity=".22"/><stop offset="1" stop-color="#4a236e" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon"><stop offset="0" stop-color="#d9d2ff"/><stop offset=".66" stop-color="#ac95fd"/><stop offset="1" stop-color="#7a4ecc"/></radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbffff"/><stop offset=".5" stop-color="#74ecff"/><stop offset="1" stop-color="#4056af"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30385e"/><stop offset=".5" stop-color="#151d3c"/><stop offset="1" stop-color="#0a1027"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2=".9"><stop stop-color="#70459d"/><stop offset=".4" stop-color="#32264d"/><stop offset="1" stop-color="#10152f"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eac1b7"/><stop offset=".52" stop-color="#bb8c9e"/><stop offset="1" stop-color="#5d4e8b"/></linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f2d76"/><stop offset=".6" stop-color="#211c49"/><stop offset="1" stop-color="#101930"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6ff7f2"/><stop offset=".5" stop-color="#86c9ff"/><stop offset="1" stop-color="#d57bff"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#6560bd" stroke-width=".75" opacity=".23"/></pattern>
    <pattern id="scan" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M0 0H1280" stroke="#05091a" stroke-opacity=".22" stroke-width="1"/></pattern>
    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="25"/></filter>
    <clipPath id="artClip"><rect x="790" y="0" width="490" height="448"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','IBM Plex Mono','DejaVu Sans Mono',monospace; }
      .display { font-family: 'Inter Display','Arial',sans-serif; font-weight: 900; letter-spacing: 1px; }
      .blink { animation: flicker 5s infinite; }
      .float { animation: levitate 7s ease-in-out infinite; }
      .pulse { animation: power 5s ease-in-out infinite; }
      @keyframes flicker { 0%, 88%, 91%, 94%, 100% {opacity:1} 89%, 92% {opacity:.45} }
      @keyframes levitate {0%, 100% {transform:translateY(0)} 50% {transform:translateY(-6px)}}
      @keyframes power {0%, 100% {opacity:.5} 50% {opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <!-- Midnight city / holographic grid -->
  <rect width="1280" height="448" fill="url(#bg)"/>
  <circle cx="1027" cy="220" r="318" fill="url(#skyglow)"/>
  <rect width="1280" height="448" fill="url(#grid)" opacity=".7"/>
  <path d="M0 425L1280 425M0 432L1280 432" stroke="#b26bff" stroke-opacity=".28"/>
  <path d="M740 0L600 448M812 0L678 448M884 0L759 448" stroke="#8b57ed" opacity=".1"/>
  <g fill="#bcacff">
    <circle cx="34" cy="112" r="1.3" opacity=".6"/><circle cx="226" cy="43" r="1.3"/><circle cx="515" cy="92" r="1"/><circle cx="740" cy="201" r="1.6"/><circle cx="864" cy="53" r="1.4"/><circle cx="1230" cy="71" r="1.3"/>
    <circle cx="1201" cy="231" r=".8"/><circle cx="694" cy="36" r=".8"/><circle cx="800" cy="342" r="1.1"/>
  </g>

  <!-- Anime skyline -->
  <g clip-path="url(#artClip)" opacity=".62">
    <path d="M790 325V261h22v-37h30v24h19v-65h24v-37h24v104h24v-72h25v32h20v-92h33v45h17v-56h23v74h27v-37h22v24h24v-88h36v60h17v-26h20v111h34v-37h29v140Z" fill="#1b1c40"/>
    <path d="M790 361v-57h32v-44h20v34h33v-83h23v55h34v-34h20v57h35v-89h23v47h32v-63h32v86h27v-39h24v45h27v-67h25v50h33v-29h31v131Z" fill="#222144"/>
    <g stroke="#d076ff" stroke-width="3" opacity=".42">
      <path d="M817 285v8m27-31v7m56-24v9m31-17v8m68-8v8m45-16v8m73-13v9m61-1v9m36-15v10"/>
    </g>
    <g stroke="#6ae4fc" stroke-width="3" opacity=".37">
      <path d="M810 321v8m52-24v8m70-7v7m69-11v8m38-30v8m95 14v9m66-11v10"/>
    </g>
  </g>

  <!-- Tech ring / neon moon -->
  <g class="float">
    <circle cx="1065" cy="176" r="138" fill="url(#moon)" opacity=".87"/>
    <circle cx="1065" cy="176" r="153" fill="none" stroke="#d87cff" stroke-width="1.5" opacity=".61" stroke-dasharray="4 11"/>
    <circle cx="1065" cy="176" r="167" fill="none" stroke="#73e5ff" stroke-width="1" opacity=".3" stroke-dasharray="64 28 4 40"/>
    <path d="M874 176h27m327 0h25M1065 0v20m0 312v28" stroke="#7de9ff" opacity=".62"/>
  </g>
  <g class="pulse" stroke="#ee8cff" stroke-width="1.5" opacity=".8">
    <path d="M914 97h-29v18M1220 271h-17v22M1160 43h27v13" fill="none"/>
  </g>

  <!-- Sword blade behind engineer -->
  <g transform="rotate(23 1014 290)" opacity=".89">
    <path d="M1042 71L1054 69L1061 326L1047 330Z" fill="url(#blade)" filter="url(#neonGlow)"/>
    <path d="M1045 82L1053 324" stroke="#e4ffff" stroke-width="2"/>
    <path d="M1021 322H1083" stroke="#ca7eff" stroke-width="11" stroke-linecap="round"/>
    <path d="M1046 332V427" stroke="#302544" stroke-width="17"/>
    <path d="M1038 347h16m-16 20h16m-16 20h16m-16 20h16" stroke="#b483ff" stroke-width="2"/>
  </g>

  <!-- Original anime character: face, windswept hair, cyber suit -->
  <g>
    <!-- Coat rear shoulders -->
    <path d="M862 448L884 374Q911 339 971 328L986 309h73l22 22q74 9 101 49l30 68Z" fill="url(#coat)" stroke="#745ba9" stroke-width="2"/>
    <path d="M861 448q28-87 99-102l-29 102Z" fill="#11182e"/>
    <path d="M1205 448q-29-86-106-105l29 105Z" fill="#11172e"/>
    <path d="M958 338l64 68-48 42h-51l-8-53Z" fill="#303659" stroke="#81e7ff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M1093 340l-57 70 53 38h55l10-57Z" fill="#2b3055" stroke="#c582ff" stroke-opacity=".62" stroke-width="2"/>
    <path d="M1013 326L1029 385l31-61" fill="#171a34" stroke="#88e8ff" stroke-width="2"/>
    <path d="M1030 388l-14 60h45l-18-61Z" fill="#263158"/>
    <path d="M1029 385l7 9 7-9-7-9Z" fill="#71e9ff" filter="url(#neonGlow)"/>
    <path d="M880 443q4-43 29-57m260 57q-5-44-31-59" fill="none" stroke="#6de9ff" stroke-width="3" opacity=".7"/>
    <path d="M910 402l-9 46m251-47 9 47" stroke="#cb7bff" stroke-width="4" opacity=".52"/>
    <!-- Neck -->
    <path d="M994 283l4 53 30 27 36-34-3-50Z" fill="url(#skin)"/>
    <path d="M994 313l27 26 31-18" stroke="#433562" stroke-width="7" fill="none" opacity=".5"/>
    <!-- Face and ear -->
    <path d="M968 190q2-43 32-61 38-25 80-5 22 10 24 45l-9 86q-4 31-32 58l-32 17q-24-10-43-34-21-31-20-72Z" fill="url(#skin)" stroke="#49315d" stroke-width="2.5"/>
    <path d="M1083 220q21-10 26 5 4 16-14 23" fill="#af7e9e" stroke="#5c4475" stroke-width="2"/>
    <path d="M978 235l-13 15-4-22 7-22" fill="#915f8d"/>
    <!-- Eye anatomy -->
    <path d="M1000 221q20-13 43-7" stroke="#291a3c" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M1004 226q21-9 38-6" stroke="#76f3f7" stroke-width="3.2" stroke-linecap="round" fill="none" filter="url(#neonGlow)"/>
    <path d="M1021 216l2 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M1062 216l15 0" stroke="#291a3c" stroke-width="5" stroke-linecap="round"/>
    <path d="M1062 222l14 0" stroke="#79e9ff" stroke-width="2"/>
    <!-- Mask -->
    <path d="M978 240q50 15 122-6l-8 50q-24 32-62 46-36-12-51-42Z" fill="url(#mask)" stroke="#b478d1" stroke-width="2"/>
    <path d="M991 261q35 14 97-5" stroke="#84ebfc" stroke-opacity=".7" stroke-width="2" fill="none"/>
    <path d="M1007 287h46m-49 8h42" stroke="#d38aff" stroke-width="2" opacity=".67"/>
    <path d="M978 246l-17 8m139-12 12 6" stroke="#97e9ff" stroke-width="3"/>
    <!-- Hair silhouette and highlights -->
    <path d="M950 239q-17-47 1-91l-24-6 28-12-13-34 45 13q43-31 89-11l42-12-12 26 25 10-23 10q20 30 10 69l-15-32-17 12q-4-25-15-35-27 33-64 42l-6-18q-27 27-46 28l-1 41Z" fill="url(#hair)" stroke="#9d66d7" stroke-width="2"/>
    <path d="M958 152q26-45 78-49m-31 67q46-17 69-50m-42 70q36-12 53-43" stroke="#b27ded" stroke-width="5" stroke-linecap="round" opacity=".66" fill="none"/>
    <path d="M934 111l29 20-21-4m131-21 21 21-21-8" stroke="#df86fa" stroke-width="3" stroke-linejoin="round" opacity=".6" fill="none"/>
    <path d="M964 189l-7 58" stroke="#d886ff" stroke-width="5" opacity=".45"/>
    <!-- futuristic ear piece -->
    <path d="M1099 200l18 6v46l-18 11-10-8v-43Z" fill="#1b2d53" stroke="#84ecff" stroke-width="2"/>
    <path d="M1108 212v27" stroke="#74efff" stroke-width="4" filter="url(#neonGlow)"/>
    <path d="M1115 224q22 1 26 30" stroke="#85b4fc" stroke-width="2" fill="none"/>
  </g>

  <!-- Floating sakura petals / anime motion lines -->
  <g fill="#f197ea" opacity=".8" class="float">
    <path d="M878 67q14-5 17 10-13 8-17-10Z"/><path d="M1237 122q10-10 19 2-8 12-19-2Z"/><path d="M806 238q16-7 17 10-15 10-17-10Z"/>
    <path d="M1216 361q10-11 19 1-8 12-19-1Z"/>
  </g>
  <path d="M812 107l51-22M1200 316l50-19M837 366l30-11" stroke="#7ef0f7" stroke-width="2" opacity=".54"/>

  <!-- Left editorial content -->
  <path d="M54 52H78M54 52V78M713 52h25v26M54 393v22h25" stroke="#69e8f5" stroke-width="2"/>
  <path d="M81 68h450" stroke="#71e6fa" stroke-opacity=".29"/>
  <text x="80" y="52" class="mono" fill="#7de6f1" font-size="15" letter-spacing="3">// PLAYER 01  ·  SYSTEM ARCHITECT</text>
  <text x="82" y="174" class="display" fill="#d471ff" font-size="95" opacity=".34">LUCAS</text>
  <text x="78" y="170" class="display" fill="#f7f5ff" font-size="95">LUCAS</text>
  <text x="82" y="267" class="display" fill="#bd71f6" font-size="106" opacity=".38">PAZ.</text>
  <text x="78" y="262" class="display" fill="url(#neon)" font-size="106">PAZ.</text>
  <rect x="80" y="287" width="505" height="1.5" fill="url(#neon)" opacity=".83"/>
  <text x="81" y="316" font-family="'Inter',Arial,sans-serif" fill="#e7eaff" font-weight="700" font-size="22" letter-spacing="1.8">CTO  /  SOFTWARE ARCHITECT</text>
  <text x="81" y="344" class="mono" fill="#b7bdd6" font-size="15" letter-spacing=".8">Business strategy meets production-grade code.</text>
  <g transform="translate(79 365)" class="mono" font-weight="bold" letter-spacing="1" font-size="14">
    <rect width="86" height="32" rx="5" fill="#122f40" stroke="#53c7e8" opacity=".98"/><text x="43" y="21" fill="#92f7fc" text-anchor="middle">GO</text>
    <rect x="98" width="100" height="32" rx="5" fill="#2b1d3f" stroke="#be76f2"/><text x="148" y="21" fill="#e4adff" text-anchor="middle">RUST</text>
    <rect x="210" width="110" height="32" rx="5" fill="#122f40" stroke="#53c7e8"/><text x="265" y="21" fill="#92f7fc" text-anchor="middle">PYTHON</text>
    <rect x="332" width="119" height="32" rx="5" fill="#2b1d3f" stroke="#be76f2"/><text x="391.5" y="21" fill="#e4adff" text-anchor="middle">LARAVEL</text>
  </g>
  <text x="80" y="427" class="mono" fill="#8f9ec5" font-size="13" letter-spacing="2">BUILD  //  SHIP  //  SCALE</text>
  <text x="1223" y="420" text-anchor="end" font-family="'Noto Sans CJK JP',sans-serif" fill="#b88fff" font-size="14" opacity=".75">技術 × 戦略</text>

  <!-- Final scan + border accents -->
  <rect width="1280" height="448" fill="url(#scan)" pointer-events="none" opacity=".25"/>
  <path d="M0 447H1280" stroke="#8b6dff" stroke-width="2"/><path d="M1 0V448" stroke="#71e9ff" stroke-width="2"/>
</svg>